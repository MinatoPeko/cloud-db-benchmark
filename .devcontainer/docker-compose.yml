version: '3.8'

# ============================================================================
# ĐỒ ÁN CHUYÊN NGÀNH KỸ THUẬT PHẦN MỀM - ĐẠI HỌC PHENIKAA
# Hạ tầng ảo hóa Dev Container cho GitHub Codespaces (4 vCPUs / 16 GB RAM)
# File này nằm trong thư mục .devcontainer/ và được tự động điều phối bởi Codespaces
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. Môi trường Làm việc Chính (VS Code Workspace & Test Runner)
  # --------------------------------------------------------------------------
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.11-bullseye
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
    networks:
      - benchmark-net

  # --------------------------------------------------------------------------
  # 2. PostgreSQL 16 (Cơ sở dữ liệu Quan hệ - Relational RDBMS)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_benchmark
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - benchmark-net

  # --------------------------------------------------------------------------
  # 3. MongoDB 7.0 (Cơ sở dữ liệu Hướng tài liệu - Document NoSQL)
  # --------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 2
    ports:
      - "27017:27017"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - mongo_data:/data/db
    networks:
      - benchmark-net

  # --------------------------------------------------------------------------
  # 4. Neo4j 5.x (Cơ sở dữ liệu Đồ thị - Property Graph Database)
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "2G"
    ports:
      - "7474:7474"   # Neo4j Browser Web UI
      - "7687:7687"   # Bolt Protocol Data Port
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 2G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - benchmark-net

# ----------------------------------------------------------------------------
# Phân vùng lưu trữ bền vững (Volumes) và Mạng nội bộ ảo hóa (Networks)
# ----------------------------------------------------------------------------
volumes:
  postgres_data:
  mongo_data:
  neo4j_data:

networks:
  benchmark-net:
    driver: bridge
